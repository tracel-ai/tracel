[package]
name = "basics"
edition.workspace = true
version.workspace = true
publish = false

[features]
station = ["tracel/station", "tracel/runner"]

[dependencies]
tracel = { workspace = true, features = ["schema"] }
anyhow.workspace = true
serde = { workspace = true, features = ["std", "derive"] }
schemars.workspace = true
tracing.workspace = true

# The station runner example serves jobs to a Tracel Station job queue.
[[example]]
name = "runner"
required-features = ["station"]
