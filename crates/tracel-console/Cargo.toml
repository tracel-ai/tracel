[package]
name = "tracel-console"
description = "Burn-free SDK for the Tracel console domain."
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
futures = { workspace = true, features = ["std"] }
bytes = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracel-artifact = { workspace = true }
tracel-task = { workspace = true }
tracel-client = { workspace = true }
tracel-datasets = { workspace = true }
tracel-experiment = { workspace = true }
tracel-experiment-remote = { workspace = true }
tracel-models = { workspace = true }
url = { workspace = true }

# Capabilities not yet handed back as jobs still bridge into a runtime of their own.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossbeam = { workspace = true }
tracel-artifact = { workspace = true, features = ["fs"] }
tracel-task = { workspace = true, features = ["tokio"] }
tracel-inference = { workspace = true }
