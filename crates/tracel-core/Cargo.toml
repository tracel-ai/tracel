[package]
name = "tracel-core"
description = "Core runtime for the Tracel SDK: connects experiment tracking, inference, and the model registry to cloud, station, or offline backends."
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
station = ["dep:tracel-station", "tracel-client/station"]

[dependencies]
tracel-client.workspace = true
tracel-console.workspace = true
tracel-datasets.workspace = true
tracel-models = { workspace = true, features = ["fs"] }
tracel-station = { workspace = true, optional = true }
tracel-experiment.workspace = true
tracel-inference.workspace = true
url.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam.workspace = true
futures = { workspace = true, features = ["std"] }
tracel-task = { workspace = true }
tracel-artifact = { workspace = true, features = ["fs"] }

# Discovering credentials and the project from the environment.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
