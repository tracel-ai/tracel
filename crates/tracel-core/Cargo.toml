[package]
name = "tracel-core"
description = "Core runtime for the Tracel SDK: connects experiment tracking, inference, and the model registry to cloud, station, or offline backends."
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
station = ["dep:tracel-station"]

[dependencies]
tracel-console.workspace = true
tracel-datasets.workspace = true
tracel-models.workspace = true
tracel-station = { workspace = true, optional = true }
tracel-experiment.workspace = true
tracel-inference.workspace = true
url.workspace = true
thiserror.workspace = true
serde_json.workspace = true
crossbeam.workspace = true
tracel-artifact.workspace = true

[dev-dependencies]
tempfile.workspace = true
