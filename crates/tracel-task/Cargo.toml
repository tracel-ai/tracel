[package]
name = "tracel-task"
description = "Effect handles for the Tracel SDK: work you can await, block on, or poll without depending on a runtime."
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["futures/std", "futures/executor", "async-channel/std"]
tokio = ["std", "dep:tokio", "dep:pin-project-lite"]

[dependencies]
async-channel = { version = "2.5.0", default-features = false }
futures = { version = "0.3.33", default-features = false, features = ["alloc"] }
pin-project-lite = { version = "0.2", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["time"] }
