[package]
name = "tracel"
authors.workspace = true
categories.workspace = true
description = "High-level Tracel SDK"
keywords.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
version.workspace = true
rust-version.workspace = true

[features]
default = []
server = ["tracel-app/server"]
station = ["dep:tracel-station", "dep:url"]
runner = ["dep:tracel-runner"]
burn = ["tracel-experiment/burn", "tracel-datasets/burn"]
schema = ["tracel-app/schema"]

[dependencies]
tracel-app.workspace = true
tracel-runner = { workspace = true, optional = true }
tracel-experiment = { workspace = true, features = ["local"] }
tracel-inference.workspace = true
tracel-job.workspace = true
tracel-artifact.workspace = true
tracel-console.workspace = true
tracel-station = { workspace = true, optional = true }
tracel-datasets.workspace = true
tracel-models.workspace = true
thiserror.workspace = true
url = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true, features = ["std"] }
tempfile.workspace = true
