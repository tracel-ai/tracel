[package]
name = "tracel"
authors.workspace = true
categories.workspace = true
description = "High-level Tracel SDK"
keywords.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
version.workspace = true
rust-version.workspace = true

[features]
default = []
server = ["tracel-app/server"]
station = ["dep:tracel-station", "tracel-core/station"]
runner = ["dep:tracel-runner"]
burn = ["tracel-experiment/burn", "tracel-datasets/burn"]

[dependencies]
tracel-core.workspace = true
tracel-experiment.workspace = true
tracel-inference.workspace = true
tracel-artifact = { workspace = true, features = ["fs"] }
tracel-console.workspace = true
tracel-station = { workspace = true, optional = true }
tracel-datasets.workspace = true
tracel-models = { workspace = true, features = ["fs"] }
tracel-task.workspace = true

# The CLI, server, and runner front-ends block at their edges or run on tokio.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracel-app.workspace = true
tracel-runner = { workspace = true, optional = true }
