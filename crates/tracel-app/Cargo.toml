[package]
name = "tracel-app"
description = "Runners for the Tracel SDK: run registered jobs from a command line or serve them over HTTP."
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
server = ["dep:axum", "dep:tokio", "dep:tokio-stream"]
schema = ["dep:schemars"]

[dependencies]
clap = { workspace = true, features = ["derive", "string"] }
clap_complete.workspace = true
ctrlc = { workspace = true, features = ["termination"] }
tracel-experiment.workspace = true
tracel-inference.workspace = true
tracel-job.workspace = true
serde.workspace = true
serde_json.workspace = true
json-patch.workspace = true
schemars = { workspace = true, optional = true }
thiserror.workspace = true
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync"] }
tokio-stream = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracel-experiment = { workspace = true, features = ["local"] }
