[workspace]
# Try
# require version 2 to avoid "feature" additiveness for dev-dependencies
# https://doc.rust-lang.org/cargo/reference/resolver.html#feature-resolver-version-2
resolver = "2"

members = ["crates/*", "examples/*", "xtask"]

[workspace.package]
edition = "2024"
version = "0.10.0"
readme = "README.md"
license = "MIT OR Apache-2.0"
rust-version = "1.87.0"
authors = ["Tracel Technologies Inc."]
repository = "https://github.com/tracel-ai/tracel"
keywords = ["tracel", "burn", "sdk"]
categories = ["development-tools"]

[workspace.dependencies]
burn = { version = "0.22.0-pre.3", default-features = false, features = [
    "train",
] }

rand = "0.9.2"
ctrlc = "3.5.2"
dotenvy = "0.15"
tempfile = "3.27.0"

url = "2.5.8"
anyhow = "1.0.103"
clap = { version = "4.6", features = ["derive"] }
derive-new = { version = "0.7.0", default-features = false }
log = { version = "0.4.33", features = ["std"] }
proc-macro2 = "1.0.106"
quote = "1.0.46"
serde = { version = "1.0.228", default-features = false, features = [
    "derive",
    "alloc",
] } # alloc is for no_std, derive is needed
serde_json = "1.0.150"
syn-serde = { version = "0.3.2", features = ["json"] }
sha2 = "0.10.9"
strum = { version = "0.27.2", features = ["derive"] }
syn = { version = "2.0.118", features = ["extra-traits", "full"] }
thiserror = "2.0.18"
crossbeam = { version = "0.8.4", default-features = false, features = [
    "crossbeam-channel",
    "std",
] }
json-patch = { version = "4.1.0", default-features = false }
schemars = "1.2.2"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
uuid = { version = "1.23.4", features = ["serde"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tokio-stream = "0.1"
variadics_please = "1.1.0"
tynm = { version = "0.2.0", features = ["info"] }
derive_more = { version = "2.1.1", default-features = false, features = [
    "deref",
    "from",
    "display",
    "unwrap",
] }
chrono = "0.4.45"
tracing = "0.1.44"
tracing-core = "0.1.36"
tracing-subscriber = "0.3.23"
opentelemetry = { version = "0.31.0", features = ["metrics"] }
serde_with = { version = "3.20.0", features = ["base64", "macros"] }

## External Crate
# The console endpoints the models capability reads only exist on the client's
# platform branch; this returns to a published version once they ship.
tracel-client = { git = "https://github.com/tracel-ai/tracel-client", branch = "feat/platform-client", default-features = false, features = [
    "console",
    "station",
] }

## Crate
tracel-runner = { path = "crates/tracel-runner", version = "0.10.0" }
tracel-console = { path = "crates/tracel-console", version = "0.10.0" }
tracel-models = { path = "crates/tracel-models", version = "0.10.0" }
tracel-app = { path = "crates/tracel-app", version = "0.10.0" }
tracel-inference = { path = "crates/tracel-inference", version = "0.10.0" }
tracel-artifact = { path = "crates/tracel-artifact", version = "0.10.0" }
tracel-experiment = { path = "crates/tracel-experiment", version = "0.10.0" }
tracel-core = { path = "crates/tracel-core", version = "0.10.0" }
tracel = { path = "crates/tracel", version = "0.10.0" }

### For xtask crate ###
tracel-xtask = { version = "=5.0.0" }

[profile.dev]
debug = 0 # Speed up compilation time and not necessary.
