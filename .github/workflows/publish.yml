name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  # --------------------------------------------------------------------------------
  tracel-inference:
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: tracel-inference
      tag-validation: false
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
  # --------------------------------------------------------------------------------
  tracel-artifact:
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: tracel-artifact
      tag-validation: false
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
  # --------------------------------------------------------------------------------
  tracel-experiment:
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: tracel-experiment
      tag-validation: false
    needs:
      - tracel-artifact
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
  # --------------------------------------------------------------------------------
  tracel-core:
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: tracel-core
      tag-validation: false
    needs:
      - tracel-artifact
      - tracel-experiment
      - tracel-inference
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  # --------------------------------------------------------------------------------
  tracel-runner:
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: tracel-runner
      tag-validation: false
    needs:
      - tracel-experiment
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
  # --------------------------------------------------------------------------------
  tracel-app:
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: tracel-app
      tag-validation: false
    needs:
      - tracel-artifact
      - tracel-core
      - tracel-experiment
      - tracel-fleet
      - tracel-inference
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
  # --------------------------------------------------------------------------------
  tracel:
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: tracel
      tag-validation: false
    needs:
      - tracel-artifact
      - tracel-core
      - tracel-experiment
      - tracel-fleet
      - tracel-inference
      - tracel-app
      - tracel-runner
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
